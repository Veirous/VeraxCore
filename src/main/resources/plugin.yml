name: VeraxCore
version: '${project.version}'
main: com.verax.veraxcore.VeraxCore
api-version: 1.16
author: VeraxDev
website: https://www.spigotmc.org/resources/138126/
softdepend: [LuckPerms, Essentials]

commands:
  rapor:
    description: Player reporting command.
    aliases: [report]
  veraxcore:
    description: Main administrative command of the VeraxCore plugin.
    aliases: [vc]
    permission: veraxcore.admin
    usage: /veraxcore [reload|info|modules|help]
  yetkilisüre:
    description: Displays staff activity times.
    aliases: [admintime]
  ys:
    description: Staff chat command.
    aliases: [sc, staffchat]
  sohbet:
    description: Opens, closes, or clears the chat.
    aliases: [chat]
    usage: /sohbet [open|close|clear]
  duyuru:
    description: Broadcasts a title announcement to the screen.
    aliases: [announcement]
    usage: /duyuru <message>
  spawn:
    description: Teleports to spawn point or sets spawn points.
    usage: /spawn [set|setfirst|remove]
  ticaret:
    description: Sends a trade announcement.
    aliases: [trade]
  doğrula:
    description: Staff account verification.
    aliases: [verify]
  çöp:
    description: Opens the trash bin.
    aliases: [trash]
  pv:
    description: Opens the player vault menu.
    aliases: [vault, playervault]
  pvadmin:
    description: Player vault management command.
    permission: veraxcore.pv.admin
    aliases: [pva, vaultadmin]
  otoduyuru:
    description: Toggles automatic chat announcements.
    aliases: [autoannouncement]
  bakım:
    description: Server maintenance management command.
    permission: veraxcore.maintenance
  maintenance:
    description: Server maintenance management command.
    permission: veraxcore.maintenance

permissions:
  veraxcore.admin:
    description: Grants all VeraxCore permissions.
    default: op
    children:
      veraxcore.chat.talk: true
      veraxcore.chat.open: true
      veraxcore.chat.lock: true
      veraxcore.chat.clear: true
      veraxcore.announcement: true
      veraxcore.stafftime.view: true
      veraxcore.stafftime.reset: true
      veraxcore.stafftime.sendlog: true
      veraxcore.staffchat: true
      veraxcore.spawn.set: true
      veraxcore.spawn.setfirst: true
      veraxcore.spawn.remove: true
      veraxcore.spawn.bypass: true
      veraxcore.report: true
      veraxcore.trade: true
      veraxcore.trash: true
      veraxcore.pv.admin: true
      veraxcore.maintenance: true
      veraxcore.maintenance.bypass: true

  veraxcore.chat.talk:
    description: Permission to talk when chat is locked.
    default: false

  veraxcore.chat.open:
    description: Permission to open chat.
    default: false

  veraxcore.chat.lock:
    description: Permission to lock/close chat.
    default: false

  veraxcore.chat.clear:
    description: Permission to clear chat.
    default: false

  veraxcore.announcement:
    description: Permission to send title announcements.
    default: false

  veraxcore.stafftime.view:
    description: Permission to view staff activity times.
    default: false

  veraxcore.stafftime.reset:
    description: Permission to reset staff activity times.
    default: op

  veraxcore.stafftime.sendlog:
    description: Permission to send staff activity report to Discord.
    default: op

  veraxcore.staffchat:
    description: Permission to use staff chat.
    default: false

  veraxcore.spawn.set:
    description: Permission to set normal spawn point.
    default: op

  veraxcore.spawn.setfirst:
    description: Permission to set first-join spawn point.
    default: op

  veraxcore.spawn.remove:
    description: Permission to remove spawn point.
    default: op

  veraxcore.spawn.bypass:
    description: Permission to bypass spawn teleport delay.
    default: false

  veraxcore.report:
    description: Permission to manage report actions (accept/deny).
    default: false

  veraxcore.trade:
    description: Permission to open trade menu.
    default: false

  veraxcore.trash:
    description: Permission to use trash bin.
    default: false

  veraxcore.pv.admin:
    description: Permission to view and edit player vaults.
    default: op

  veraxcore.pv.amount:
    description: Determines how many vaults a player has (veraxcore.pv.amount.<number>).
    default: false

  veraxcore.pv.slot:
    description: Determines how many slots vaults consist of (veraxcore.pv.slot.<number>).
    default: false

  veraxcore.maintenance:
    description: Permission to use maintenance commands.
    default: op

  veraxcore.maintenance.bypass:
    description: Permission to bypass maintenance mode.
    default: op

