name: VeraxCore
version: '${project.version}'
main: dev.verax.veraxdev.veraxcore.VeraxCore
api-version: 1.16
author: VeraxDev
website: https://www.spigotmc.org/resources/138126/
description: "All-in-one advanced management, security, and utility core plugin."
softdepend: [LuckPerms, Essentials, PlaceholderAPI]

commands:
  veraxcore:
    description: Main administrative command of VeraxCore.
    aliases: [vc]
  report:
    description: Player reporting command and management.
    aliases: [rapor]
  staffplaytime:
    description: Displays and tracks staff activity playtime.
    aliases: [yetkilisüre]
  staffchat:
    description: Staff chat communication command.
    aliases: [sc, ys]
  chat:
    description: Chat control system (lock, clear, unmute).
    aliases: [sohbet]
  announcement:
    description: Broadcasts a title announcement to players.
    aliases: [duyuru]
  spawn:
    description: Teleports to spawn or manages spawn points.
  trade:
    description: Trade broadcast announcement and management menu.
    aliases: [ticaret]
  verify:
    description: Staff two-step security verification.
    aliases: [doğrula]
  trash:
    description: Opens a temporary disposal trash bin.
    aliases: [çöp]
  pv:
    description: Opens private player storage vaults.
    aliases: [vault, playervault]
  pvadmin:
    description: Administrative player vault management.
    aliases: [pva, vaultadmin]
  autoannouncement:
    description: Toggles automatic chat announcements.
    aliases: [otoduyuru]
  maintenance:
    description: Server maintenance mode management.
    aliases: [bakım]
  restarttimer:
    description: Timed server restart countdown management.
    permission: veraxcore.restarttimer
