# ==============================================================================
#                     VERAX CORE - ENGLISH LANGUAGE FILE (EN)
# ==============================================================================

# ==============================================================================
#                        💬 GENERAL SYSTEM MESSAGES
# ==============================================================================
messages:
  # ----------------------------------------------------------------------------
  # ⚙️ CORE COMMAND & PERMISSION MESSAGES
  # ----------------------------------------------------------------------------
  no-permission: "%prefix% &cYou do not have permission to use this command!"
  reload-success: "%prefix% &aPlugin configuration and language reloaded successfully!"
  module-disabled: "%prefix% &cThis feature is currently disabled!"
  only-players: "%prefix% &cOnly in-game players can use this command!"
  player-not-found: "%prefix% &cSpecified player was not found or is offline!"

  # ----------------------------------------------------------------------------
  # 📦 PLAYER VAULT (PV) MESSAGES
  # ----------------------------------------------------------------------------
  pv-opened: "%prefix% &fVault &a#%vault_no% &fOpened."
  pv-opened-admin: "%prefix% &fVault &a#%vault_no% &fof player &a%player% &fwas opened."
  pv-locked-error: "%prefix% &cYou do not have access to this vault! You must obtain VIP or a Vault Voucher."
  pv-no-permission: "%prefix% &cYou do not have permission to use this command!"
  pv-player-not-found: "%prefix% &cSpecified player was not found!"
  pv-invalid-args: "%prefix% &cUsage: /pvadmin show <player> [vault_no]"

  # ----------------------------------------------------------------------------
  # 📢 CHAT MANAGEMENT & ANNOUNCEMENT MESSAGES
  # ----------------------------------------------------------------------------
  chat-closed-error: "%prefix% &cChat is currently locked!"
  spam-warning: "%prefix% &fYou cannot spam! Please wait &#1B4FFF%remaining% &fseconds."
  chat-already-open: "%prefix% &fChat is already &#1BA1FFopen."
  chat-already-closed: "%prefix% &fChat is already &cclosed."
  chat-opened-broadcast: "%prefix% &fChat was unlocked by &a{player}&a."
  chat-closed-broadcast: "%prefix% &fChat was locked by &c{player}&c."
  chat-cleared-broadcast: "%prefix% &fChat was cleared by &a{player}&a."
  announcement-usage: "%prefix% &cUsage: &#1BA1FF/announcement or /duyuru <message>"
  announcement-sent: "%prefix% &aAnnouncement was successfully sent to screen."
  auto-announcement-toggle-on: "%prefix% &aAuto announcements successfully enabled."
  auto-announcement-toggle-off: "%prefix% &cAuto announcements disabled."
  auto-announcement-usage: "%prefix% &cUsage: &#1BA1FF/autoannouncement <on/off>"

  # ----------------------------------------------------------------------------
  # 📍 SPAWN & TELEPORTATION MESSAGES
  # ----------------------------------------------------------------------------
  spawn-not-set: "%prefix% &cSpawn point has not been set yet!"
  spawn-set-success: "%prefix% &aSpawn point successfully set to your current location!"
  first-spawn-set-success: "%prefix% &aFirst-join and respawn point successfully set to your current location!"
  spawn-deleted-success: "%prefix% &aSpawn point successfully removed!"
  first-spawn-deleted-success: "%prefix% &aFirst-join and respawn point successfully removed!"

  # ----------------------------------------------------------------------------
  # 🚨 PLAYER REPORT SYSTEM MESSAGES
  # ----------------------------------------------------------------------------
  report-usage: "%prefix% &cUsage: &#1BA1FF/report or /rapor <player> <reason>"
  report-self: "%prefix% &cYou cannot report yourself!"
  report-success: "%prefix% &fReport &asuccessfully &fsubmitted to staff."
  report-cooldown-warning: "%prefix% &cPlease wait &e%remaining% &cseconds before submitting another report!"
  report-staff-notification: "&8[&cReport&8] &#1BA1FF{reporter} &f-> &#FF3333{reported}&f: &e{reason}"

  # ----------------------------------------------------------------------------
  # 🛡️ SECURITY & VERIFICATION (2FA) MESSAGES
  # ----------------------------------------------------------------------------
  verification-required: "%prefix% &fYou are currently in Verification. Please enter the &#1B4FFFcode &fsent via Discord. &8(&c%remaining_attempts% Attempts&8)"
  verification-reminder: "%prefix% &fYou are currently in Verification. Please enter the &#1B4FFFcode &fsent via Discord. &8(&c%remaining_attempts% Attempts &8| &#FFAA00%seconds%s&8)"
  verification-not-needed: "%prefix% &aYou do not have pending login verification or you are already verified."
  verification-usage: "%prefix% &cUsage: &#1BA1FF/verify <code>"
  verification-success: "%prefix% &fVerification &aSuccessfully &fPassed!"
  verification-failed: "%prefix% &cInvalid Code! Remaining attempts: &#FFAA00%remaining_attempts%/%max_attempts%"
  verification-bossbar: "&#FF0000🛡️ Verification Time: &#FFAA00%seconds%s &8| &7Attempts Left: &#FF5555%remaining_attempts%/%max_attempts%"
  verification-title: "&#1B4FFF&lVERIFICATION REQUIRED"
  verification-subtitle: "&fEnter Discord code: &#1BA1FF/verify <code> &8(&e%remaining_attempts% Attempts&8)"
  verification-wrong-title: "&#FF0000&lWRONG CODE!"
  verification-wrong-subtitle: "&cRemaining attempts: &#FFAA00%remaining_attempts%/%max_attempts%"
  verification-success-title: "&#00FF00&lVERIFIED!"
  verification-success-subtitle: "&aLogin successfully approved. Have fun!"
  verification-timeout-kick: "&#FF0000&lVERIFICATION TIMED OUT!\n&7You did not enter the code in time.\n&fPlease check Discord and reconnect."
  verification-max-attempts-kick: "&#FF0000&lTOO MANY FAILED ATTEMPTS!\n&7You exceeded the maximum verification attempts.\n&fPlease check Discord and reconnect."

  # ----------------------------------------------------------------------------
  # 🗑️ TRASH BIN MESSAGES
  # ----------------------------------------------------------------------------
  trash-opened: "%prefix% &aTrash bin opened. Items placed inside will be deleted!"

  # ----------------------------------------------------------------------------
  # ⚖️ TRADE SYSTEM MESSAGES
  # ----------------------------------------------------------------------------
  trade-start: "%prefix% &fYou are now typing a &#1B4FFFtrade &fmessage, type &c\"cancel\" &fto abort"
  trade-cancel: "%prefix% &fYour trade message request was &ccancelled."
  trade-cooldown-msg: "%prefix% &cYou must wait &#1BA1FF%remaining% &cseconds before posting another trade."
  trade-global-cooldown-msg: "%prefix% &cAnother player recently posted a trade! Please wait &#1BA1FF%remaining% &cseconds."
  trade-success: "%prefix% &aTrade message successfully sent!"
  trade-max-one: "%prefix% &cYou can only have 1 active trade message."
  trade-slot-taken: "%prefix% &cThis trade slot is taken."
  trade-expired: "%prefix% &cYour trade message has expired."
  trade-toggle-on: "%prefix% &aTrade notifications successfully enabled."
  trade-toggle-off: "%prefix% &cTrade notifications disabled."
  trade-disabled-self: "%prefix% &cYour trade mode is disabled! To open the menu and trade, type &#1BA1FF/trade on&c."
  
  # In-Game Chat Trade Announcement Format
  trade-broadcast: |
    &8________________________________________
    &7
    &#1B4FFF&lTrade Announcement
    &7
    &#1B4FFF%player% &7Is Trading! &7/trade %player%
    &7
    &#1B4FFFMessage: &7%message%
    &8________________________________________

# ==============================================================================
# 🗑️ TRASH BIN SETTINGS
# ==============================================================================
