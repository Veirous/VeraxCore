  weekly: "weekly"
  monthly: "monthly"
  total: "total"

# ==============================================================================
# 🔧 MAINTENANCE MODE SETTINGS
# ==============================================================================
maintenance:
  usage: "%prefix% &cUsage: &#1BA1FF/maintenance <on/off | start <duration>>"
  start-usage: "%prefix% &cUsage: &#1BA1FF/maintenance start <30m | 1h | 45s>"
  invalid-time: "%prefix% &cInvalid duration entered! Example: &#1BA1FF30m&c, &#1BA1FF1h&c, &#1BA1FF45s"
  already-active: "%prefix% &cMaintenance mode is already active!"
  already-disabled: "%prefix% &cMaintenance mode is already disabled!"
  enabled-success: "%prefix% &aMaintenance mode &#00FF00activated&a! Non-whitelisted players were kicked."
  disabled-success: "%prefix% &aMaintenance mode &cdisabled &aand countdown cancelled."
  countdown-started: "%prefix% &aServer will enter maintenance in &#1BA1FF%time%&a. Countdown BossBar started!"
  broadcast-started: "%prefix% &cServer is now entering maintenance mode! Have a nice day."
  bossbar-text: "&#FF3333&lMAINTENANCE MODE &8» &fServer entering maintenance in &#FF3333%remaining_time%&f!"
  active-bossbar-text: "&#FF3333&lMAINTENANCE MODE &8» &fElapsed Time: &#FF3333%elapsed_time%"
  motd-line-1: "&#1B4FFFV&#1B58FFe&#1B61FFr&#1B6AFFa&#1B73FFx&#1B7DFFC&#1B86FFo&#1B98FFr&#1BA1FFe &8» &#FF3333&lMAINTENANCE MODE"
  motd-line-2: "&7Our server is currently under maintenance. &8(&c/discord&8)"
  kick-screen: |
    &8__________________________________________________
    
    &#1B4FFFV&#1B58FFe&#1B61FFr&#1B6AFFa&#1B73FFx&#1B7DFFC&#1B86FFo&#1B98FFr&#1BA1FFe
    &#FF3333&lServer Under Maintenance
    
    &7Our server has been taken into &cmaintenance mode
    &7to provide you with a smoother gameplay experience.
    
    &#1BA1FF✦ &fFor updates and reopening announcements:
    &#1BA1FFDiscord: &fdiscord.gg/yourdiscord
    &8__________________________________________________

