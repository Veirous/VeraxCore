# ==============================================================================
# 📍 SPAWN TITLE & TELEPORT MESSAGES
# ==============================================================================
spawn-title-settings:
  title-moving: "&#1B4FFFDo Not Move!"
  subtitle-teleporting: "&#ff0000Please wait &#1ba1ff%remaining_seconds% &fseconds"

teleport-messages:
  teleport-cancelled: "%prefix% &fTeleportation &#ff0000Cancelled &fbecause you moved!"
  teleport-success: "%prefix% &fTeleportation &#00FF00Successful"

# ==============================================================================
# 👮 STAFF PLAYTIME & ACTIVITY MESSAGES
# ==============================================================================
staff-messages:
  header: "&#1B4FFF--- &#1BA1FF{status} Status &#1B4FFF---"
  list-format: "&#1BA1FF{rank}. &#1ba1ff{staff}: &F{time} {status}"
  passed-icon: "&#00FF00✔"
  failed-icon: "&#ff0000✘"
  admin-no-permission: "&cYou do not have permission to use this admin command!"
  no-permission: "&cYou cannot do this"
  log-preparing: "&#1BA1FFPreparing and sending Discord report..."
  log-success: "&#00FF00Discord report sent successfully!"

# ==============================================================================
# 💬 STAFF CHAT FORMAT
# ==============================================================================
staff-chat:
  format: "&#1B4FFFS&#1B58FFt&#1B61FFa&#1B6AFFf&#1B73FFf &#1B7DFFC&#1B86FFh&#1B8FFFa&#1B8FFFt&8: &#1BA1FF{player} &8» &f{message}"
  console-log-format: "[StaffChat] {player}: {message}"
  toggle-on: "%prefix% &aStaff chat mode enabled. Your messages will now be sent to staff chat."
  toggle-off: "%prefix% &cStaff chat mode disabled. You are now speaking in global chat."

# ==============================================================================
# 🚨 REPORT DISCORD EMBED SETTINGS
# ==============================================================================
